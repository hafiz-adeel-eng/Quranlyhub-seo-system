<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Scheherazade"; src: url(fonts/ScheherazadeNew-Bold.ttf); }
  @font-face { font-family: "Cormorant"; src: url(fonts/CormorantGaramond-Italic.ttf); font-style: italic; }
  @font-face { font-family: "Nastaliq"; src: url(fonts/NotoNastaliqUrdu.ttf); }

  :root { --gold: #d9b45a; --gold-soft: rgba(217, 180, 90, .35); --ink: #f7f3e8; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: transparent; }

  /* Layer 1: background (rendered alone as bg.png) */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 45%, #0f403c 0%, #0a2a27 50%, #041312 100%);
  }
  .bg svg { position: absolute; inset: 0; opacity: .07; }
  .frame {
    position: absolute; inset: 36px; border: 2px solid var(--gold-soft); border-radius: 6px;
  }
  .frame::after {
    content: ""; position: absolute; inset: 10px; border: 1px solid rgba(217, 180, 90, .18); border-radius: 4px;
  }

  /* Layer 2: text (rendered alone, transparent, as text.png) */
  .logo {
    position: absolute; top: 58px; left: 70px; display: flex; align-items: center; gap: 16px;
    font: 600 30px/1 "Cormorant", serif; font-style: italic; color: var(--gold); letter-spacing: .5px;
  }
  .logo img { height: 150px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  .logo .mark {
    width: 54px; height: 54px; border: 2px solid var(--gold); transform: rotate(45deg);
    display: grid; place-items: center;
  }
  .logo .mark span { transform: rotate(-45deg); font: 30px "Scheherazade"; color: var(--gold); }
  .ref {
    position: absolute; top: 76px; right: 90px;
    font: italic 30px "Cormorant", serif; color: rgba(247, 243, 232, .75);
  }
  .content {
    position: absolute; left: 150px; right: 150px; top: 190px; bottom: 90px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  }
  .arabic {
    direction: rtl; font-family: "Scheherazade", serif; font-size: 80px; line-height: 1.8; text-wrap: balance;
    color: var(--ink); text-shadow: 0 0 30px rgba(217, 180, 90, .25);
  }
  .arabic .num { color: var(--gold); }
  .divider { width: 360px; height: 2px; margin: 26px 0 30px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .english {
    font-family: "Cormorant", serif; font-style: italic; font-size: 46px; line-height: 1.35;
    color: #efe6cf; max-width: 1450px;
  }
  .urdu {
    direction: rtl; margin-top: 54px; font-family: "Nastaliq", serif; font-size: 42px; line-height: 2.1;
    color: var(--gold); max-width: 1450px; text-wrap: balance;
  }
  .hide-text .text-layer { display: none; }
  .hide-bg .bg-layer { display: none; }
  /* Over stock footage: translucent shade keeps the text readable, pattern is dropped */
  .over-video .bg {
    background: radial-gradient(ellipse at 50% 50%, rgba(4, 24, 22, .55) 0%, rgba(3, 16, 15, .72) 60%, rgba(2, 10, 9, .9) 100%);
  }
  .over-video .bg svg { display: none; }
</style>
</head>
<body>
  <div class="bg-layer">
    <div class="bg">
      <svg width="1920" height="1080">
        <defs>
          <pattern id="star" width="120" height="120" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="#d9b45a" stroke-width="1.4" transform="translate(60 60)">
              <rect x="-34" y="-34" width="68" height="68"/>
              <rect x="-34" y="-34" width="68" height="68" transform="rotate(45)"/>
              <circle r="14"/>
            </g>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#star)"/>
      </svg>
      <div class="frame"></div>
    </div>
  </div>

  <div class="text-layer">
    <div class="logo" id="logo"><div class="mark"><span>ق</span></div>QuranlyHub</div>
    <div class="ref" id="ref"></div>
    <div class="content">
      <div class="arabic" id="arabic"></div>
      <div class="divider"></div>
      <div class="english" id="english"></div>
      <div class="urdu" id="urdu"></div>
    </div>
  </div>

<script>
  // render.mjs calls setAyah(...) before each screenshot
  window.setAyah = ({ arabic, number, english, urdu, reference, logo }) => {
    const num = String(number).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
    document.getElementById("arabic").innerHTML = `${arabic} <span class="num">﴿${num}﴾</span>`;
    document.getElementById("english").textContent = english;
    document.getElementById("urdu").textContent = urdu;
    document.getElementById("ref").textContent = reference;
    if (logo) document.getElementById("logo").innerHTML = `<img src="${logo}">`;
  };
</script>
</body>
</html>
